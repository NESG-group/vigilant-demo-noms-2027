services:
  postgres:
    image: postgres:16
    container_name: vigilant-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vigilant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vigilant_pass}
      - POSTGRES_DB=${POSTGRES_DB:-vigilant_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilant} -d ${POSTGRES_DB:-vigilant_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vigilant-net
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: vigilant-ollama
    runtime: nvidia
    ports:
      - "11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - vigilant-net
    restart: always

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: vigilant-hermes
    command: gateway run
    ports:
      - "8642:8642"
      - "9119:9119"
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-change-me}
    volumes:
      - hermes-data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml
      - ./hermes/skills:/opt/data/skills
    depends_on:
      - ollama
      - vigilant-backend
    networks:
      - vigilant-net
    restart: always

  vigilant-backend:
    build: .
    container_name: vigilant-backend
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - vigilant-data:/var/lib/vigilant
      - open-webui-data:/var/lib/open-webui/data:ro
    environment:
      - HERMES_BASE_URL=http://hermes:8642/v1
      - HERMES_API_KEY=${HERMES_API_SERVER_KEY:-change-me}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vigilant}:${POSTGRES_PASSWORD:-vigilant_pass}@postgres:5432/${POSTGRES_DB:-vigilant_db}
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    command: uvicorn vigilant.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vigilant-net
    restart: always

networks:
  vigilant-net:
    driver: bridge

volumes:
  ollama-models:
  hermes-data:
  vigilant-data:
  open-webui-data:
  postgres-data: